name: Validate and deploy Marp course

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: marp-course-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pull-request code is validated with read-only repository access.
permissions:
  contents: read

env:
  UV_VERSION: "0.9.15"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked --all-groups

      - name: Render with pinned Marp CLI
        run: uv run python scripts/render_slides.py build

      - name: Validate sources, notebooks, and rendered artifacts
        run: uv run python scripts/validate.py --build-dir build

      - name: Preserve the validated production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-marp-site
          path: build
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Retrieve the validated production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-marp-site
          path: build

      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
        with:
          branch: gh-pages
          folder: build
